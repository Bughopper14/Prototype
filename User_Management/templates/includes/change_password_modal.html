<!-- Change Password Modal Include - User Management -->
<div class="modal fade" id="changePasswordModal" tabindex="-1"
     aria-labelledby="changePasswordModalLabel" aria-hidden="true" style="z-index: 1070;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.18);">
            <div style="height: 4px; background: linear-gradient(90deg, #002c5f, #ff9900); border-radius: 16px 16px 0 0;"></div>
            <div class="modal-header border-0 pb-0 pt-4 px-4">
                <div class="d-flex align-items-center gap-3">
                    <div style="width:40px; height:40px; background:linear-gradient(135deg,#002c5f,#0050a0); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#ff9900;">
                        <i class="fas fa-key"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold mb-0" id="changePasswordModalLabel">Ganti Password</h5>
                        <small class="text-muted">Perbarui password akun Anda</small>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formChangePassword" onsubmit="submitChangePassword(event)">
                <div class="modal-body px-4 py-3">
                    <div class="mb-3">
                        <label for="current_password" class="form-label fw-semibold small text-secondary">Password Saat Ini</label>
                        <input type="password" name="current_password" id="current_password" class="form-control" style="border-radius: 8px;" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-semibold small text-secondary">Password Baru</label>
                        <input type="password" name="new_password" id="new_password" class="form-control" style="border-radius: 8px;" required>
                    </div>
                    <div class="mb-2">
                        <label for="confirm_password" class="form-label fw-semibold small text-secondary">Konfirmasi Password Baru</label>
                        <input type="password" id="confirm_password" class="form-control" style="border-radius: 8px;" required>
                    </div>
                    <div class="alert alert-danger d-none p-2 small" id="changePasswordError" style="border-radius: 8px;"></div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light px-4" style="border-radius: 8px;" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary px-4" id="btnSavePassword"
                            style="border-radius: 8px; background-color: #002c5f; border-color: #002c5f;">
                        <i class="fas fa-save me-2"></i>Simpan Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
